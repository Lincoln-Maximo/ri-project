name: CI on: push: branches: [main] pull_request: branches: [main] jobs: lint-backend: runs-on: ubuntu-latest steps: - uses: actions/checkout@v4 - uses: actions/setup-python@v5 with: python-version: '3.11' - name: Instalar flake8 run: pip install flake8 - name: Rodar lint run: flake8 backend --max-line-length=120 --exclude=venv,migrations